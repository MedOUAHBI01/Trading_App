<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trading - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">

<!-- Navbar -->
<nav class="flex items-center justify-between p-4 bg-gray-800">
    <div class="text-xl font-bold">Fast Traders</div>
    <div>
        <input type="text" placeholder="Search" class="rounded p-1 text-black">
    </div>
</nav>

<!-- Tabs -->
<div class="flex justify-center mt-4 space-x-4">
    <button class="bg-gray-700 px-4 py-2 rounded">All</button>
    <button class="bg-gray-700 px-4 py-2 rounded">Top 50</button>
    <button class="bg-gray-700 px-4 py-2 rounded">Top Gainers</button>
    <button class="bg-gray-700 px-4 py-2 rounded">Top Losers</button>
</div>

<!-- Content -->
<div class="flex p-6 space-x-6">

    <!-- Table -->
    <div class="w-2/3">
        <table class="w-full table-auto">
            <thead>
            <tr class="bg-gray-700">
                <th class="p-2">Coin</th>
                <th class="p-2">Symbol</th>
                <th class="p-2">Volume</th>
                <th class="p-2">Market Cap</th>
                <th class="p-2">24H</th>
                <th class="p-2">Price</th>
            </tr>
            </thead>
            <tbody class="text-center">
            <tr class="border-b border-gray-700 hover:bg-gray-800">
                <td class="flex items-center justify-center space-x-2 p-2">
                    <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" alt="Bitcoin" class="w-5 h-5">
                    <span>Bitcoin</span>
                </td>
                <td>BTC</td>
                <td>2666006963</td>
                <td>132508209740</td>
                <td class="text-red-500">-3.03%</td>
                <td>67163</td>
            </tr>
            <!-- Ajoute d'autres lignes ici -->
            </tbody>
        </table>

        <!-- Pagination -->
        <div class="flex justify-center mt-4">
            <button class="bg-gray-700 px-4 py-2 rounded">Previous</button>
            <button class="bg-gray-700 px-4 py-2 rounded ml-2">Next</button>
        </div>
    </div>

    <!-- Chart -->
    <div class="w-1/3 bg-gray-800 rounded p-4">
        <div class="flex justify-between mb-2">
            <button class="bg-gray-700 px-2 py-1 rounded">1 Day</button>
            <button class="bg-gray-700 px-2 py-1 rounded">1 Week</button>
            <button class="bg-gray-700 px-2 py-1 rounded">1 Month</button>
        </div>
        <div class="h-64 bg-gray-700 rounded flex items-center justify-center">
            <span>Graph Placeholder</span>
        </div>
        <div class="mt-4">
            <p><strong>BTC</strong> • Bitcoin</p>
            <p class="text-2xl font-bold">67206</p>
            <p class="text-red-500">-3.03%</p>
        </div>
    </div>

</div>

</body>
</html>
